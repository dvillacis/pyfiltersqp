name: Publish to PyPI

# Triggers on a version tag (e.g. v0.3.0).  Uses PyPI Trusted Publishing —
# no API token required.  Configure once at https://pypi.org/manage/account/publishing/
# pointing at this repo / workflow / environment.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[a-z]+[0-9]*"   # alpha / beta / rc

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Smoke-test wheel
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python dist/*.whl
          .venv-check/bin/python -c "import pyfiltersqp; print('built', pyfiltersqp.__version__)"

      - name: Verify tag version matches package version
        run: |
          tag="${GITHUB_REF##*/}"
          pkg="v$(.venv-check/bin/python -c 'import pyfiltersqp; print(pyfiltersqp.__version__)')"
          echo "tag=$tag  pkg=$pkg"
          test "$tag" = "$pkg" || { echo "tag/version mismatch"; exit 1; }

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyfiltersqp
    permissions:
      id-token: write     # required for PyPI Trusted Publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release with dist artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
